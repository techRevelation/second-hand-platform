<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; background: #f0f4f8; color: #333; }
        nav { background: #2c3e50; padding: 15px 30px; display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: #ecf0f1; text-decoration: none; font-size: 16px; padding: 5px 10px; border-radius: 4px; transition: background 0.3s; }
        nav a:hover { background: #34495e; }
        .container { max-width: 800px; margin: 60px auto; padding: 20px; text-align: center; }
        h1 { font-size: 2.8rem; margin-bottom: 20px; color: #2c3e50; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: white; border-radius: 12px; padding: 30px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; cursor: pointer; text-decoration: none; color: inherit; }
        .card:hover { transform: translateY(-5px); }
        .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card-title { font-size: 1.3rem; font-weight: 600; }
        footer { margin-top: 60px; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div style="background:#e8f0fe; padding:6px 20px; margin-bottom:10px; font-size:14px;">
    {% if session.role %}
        👤 当前身份：<strong>{{ session.username }}</strong>（{{ session.role }}） |
        <a href="/logout">退出登录</a>
    {% else %}
        ⚠️ 未登录 |
        <a href="/login/user">登录为普通用户</a> ·
        <a href="/login/admin">登录为管理员</a>
    {% endif %}
    </div>
    <nav>
        <a href="/">🏠 首页</a>
        <a href="/users">👥 用户</a>
        <a href="/items">📦 商品</a>
        <a href="/orders">📋 订单</a>
        <a href="/queries">🔍 查询统计</a>
    </nav>
    <div class="container">
        <h1>📚 校园二手交易平台</h1>
        <p style="font-size:1.2rem; color:#555;">安全、便捷的校内闲置物品交易系统</p>
        <div class="card-grid">
            <a href="/users" class="card">
                <div class="card-icon">👥</div>
                <div class="card-title">用户列表</div>
            </a>
            <a href="/items" class="card">
                <div class="card-icon">📦</div>
                <div class="card-title">商品列表</div>
            </a>
            <a href="/orders" class="card">
                <div class="card-icon">📋</div>
                <div class="card-title">订单列表</div>
            </a>
            <a href="/queries" class="card">
                <div class="card-icon">🔍</div>
                <div class="card-title">查询与统计</div>
            </a>
        </div>
        <footer>© 2026 校园二手交易平台 · 数据库课程大作业</footer>
    </div>
</body>
</html>
